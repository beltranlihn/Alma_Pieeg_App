<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-BiRNs4pWcEEc6SAgVi4Ql0SDsXgKnMR0r6qmvzz+Ni0='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EEG Alma Center</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<script type="importmap">{ "imports": { "three": "./assets/vendor/three.module.js", "three/addons/": "./assets/vendor/addons/" } }</script>
</head>
<body>
  <header>
    <div class="brand">EEG Alma Center <span>0.7</span></div>
    <nav>
      <button data-page="home">Home</button>
      <button data-page="live">Live</button>
      <button data-page="routing">Routing</button>
    </nav>
    <div class="status"><div class="dot" id="hdrDot"></div><div id="hdrText">No device</div></div>
    <button id="hdrConnect" class="primary">Connect PiEEG</button>
  </header>
  <div class="session-bar">
    <div class="sb-left">
      <div class="sb-field"><label for="participant">Participant</label><input type="text" id="participant" placeholder="Name"></div>
      <div class="sb-field grow"><label for="notes">Notes</label><input type="text" id="notes" placeholder="Piece, condition, anything"></div>
      <div class="sb-meta" id="sessionMeta"></div>
      <div class="sb-clock" id="sessionClock"></div>
      <div class="sb-cue" id="calCue"><b></b><span></span><div class="sb-clock"></div></div>
    </div>
    <div class="sb-right">
      <button id="btnCal" disabled>Calibrate <kbd>C</kbd></button>
      <button id="btnMark" disabled>Mark <kbd>M</kbd></button>
      <button id="btnSession" class="action primary" disabled>Start session <kbd>R</kbd></button>
    </div>
  </div>
  <main>
    <div class="page" id="pageHome"></div>
    <div class="page hidden" id="pageLive"></div>
    <div class="page hidden" id="pageRouting"></div>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
